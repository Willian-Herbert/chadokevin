<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Confirmados e presentes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Parisienne&display=swap">
<style>
:root { --sky:#EEF5FC; --blue:#8FB3E8; --blue-deep:#5C85CE; --navy:#28367F; --paper:#fff; --ink:#2B3868; --ink-soft:#5E6C99; --line:#D3E1F3;
  --font-script:"Parisienne","Snell Roundhand",cursive; --font-body:"Nunito","Segoe UI",system-ui,sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#data { display: flex; flex-direction: column; gap: 22px; }
html { background: var(--sky); }
body { margin: 0; background: var(--sky); color: var(--ink); font: 16px/1.5 var(--font-body);
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
h1 { font-family: var(--font-script); font-weight: 400; font-size: 2.4rem; line-height: 1.1; color: var(--navy); margin: 0; text-align: center; }
h2 { font-weight: 800; font-size: .78rem; letter-spacing: .22em; text-transform: uppercase; color: var(--blue-deep); margin: 0; display: flex; justify-content: space-between; gap: 12px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
form { display: flex; gap: 10px; flex-wrap: wrap; }
input { flex: 1 1 200px; min-width: 0; font: 600 16px/1.3 var(--font-body); color: var(--ink); background: #F6FAFE; border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; }
button { font: 800 .92rem/1 var(--font-body); padding: 14px 20px; border-radius: 999px; border: 2px solid var(--blue-deep); background: var(--blue-deep); color: #fff; cursor: pointer; }
button.alt { background: transparent; color: var(--blue-deep); }
input:focus-visible, button:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
li:first-child { border-top: 0; }
li span { min-width: 0; overflow-wrap: anywhere; }
li small { color: var(--ink-soft); font-size: .82rem; flex: none; font-variant-numeric: tabular-nums; }
.item b { display: block; }
.item small { display: block; flex: initial; }
.num { color: var(--navy); font-weight: 800; font-variant-numeric: tabular-nums; }
.msg { min-height: 1.3em; font-weight: 600; color: var(--ink-soft); }
.msg.err { color: #B3412F; }
.empty { color: var(--ink-soft); margin: 0; }
</style>
</head>
<body>
<main>
  <h1>Chá do Kevin José</h1>

  <div class="msg" id="msg" role="status"></div>

  <div id="data" hidden>
    <section class="card"><h2><span>Confirmados</span><span class="num" id="n-rsvp">0</span></h2><ul id="l-rsvp"></ul></section>
    <section class="card"><h2><span>Presentes</span><span class="num" id="n-gifts">0</span></h2><ul id="l-gifts"></ul></section>
    <button class="alt" id="reload" type="button">Atualizar</button>
  </div>
</main>

<script>
/* Cole aqui o mesmo endereço do Apps Script usado no convite. */
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbweyJme15RqVN41qBezaSCuaE5QuTEcQF8rDfPPU6u-LIRzzI8IAfmiPSjJhOGRqswjHg/exec";

var $ = function (id) { return document.getElementById(id); };
var fmt = function (v) { var d = new Date(v); return isNaN(d) ? "" : d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }); };
function li(html) { var l = document.createElement("li"); l.innerHTML = html; return l; }
function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function fill(ul, rows, empty) {
  ul.textContent = "";
  if (!rows.length) { var p = document.createElement("li"); p.className = "empty"; p.textContent = empty; ul.appendChild(p); return; }
  rows.forEach(function (h) { ul.appendChild(li(h)); });
}

function load() {
  var msg = $("msg");
  if (!SCRIPT_URL) { msg.className = "msg err"; msg.textContent = "Falta colar o endereço do Apps Script no arquivo."; return; }
  msg.className = "msg"; msg.textContent = "Carregando...";
  fetch(SCRIPT_URL + "?lista=1").then(function (r) { return r.json(); }).then(function (d) {
    if (!d.ok) throw new Error("bad");
    msg.textContent = ""; $("data").hidden = false;
    $("n-rsvp").textContent = d.rsvp.length;
    fill($("l-rsvp"), d.rsvp.map(function (r) { return "<span>" + esc(r.nome) + "</span><small>" + fmt(r.data) + "</small>"; }), "Ninguém confirmou ainda.");
    var by = {};
    d.gifts.forEach(function (g) { (by[g.item] = by[g.item] || []).push(g.nome); });
    var itens = Object.keys(by).sort(function (a, b) { return by[b].length - by[a].length || a.localeCompare(b, "pt-BR"); });
    $("n-gifts").textContent = d.gifts.length;
    fill($("l-gifts"), itens.map(function (i) {
      return '<span class="item"><b>' + esc(i) + "</b><small>" + by[i].map(esc).join(", ") + '</small></span><span class="num">' + by[i].length + "</span>";
    }), "Nenhum presente escolhido ainda.");
  }).catch(function () { msg.className = "msg err"; msg.textContent = "Não foi possível carregar. Verifique a internet e tente de novo."; });
}
$("reload").addEventListener("click", load);
load();
</script>
</body>
</html>
